services:
  gateway:
    build: ./services/gateway
    image: HandsRelay-gateway
    container_name: HandsRelay-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:5010:5010"   # localhost only; expose via Tailscale, never 0.0.0.0
    environment:
      - RELAY_GATEWAY_TOKEN=${RELAY_GATEWAY_TOKEN:-}
      - HANDS_URL=${HANDS_URL:-http://host.docker.internal:5000}
      - HANDS_SECRET=<redacted>}
      - PARSER_URL=http://parser:5011
      - PARSER_SECRET=${PARSER_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach the Windows hands on the host
    depends_on:
      - parser

  parser:
    build: ./services/parser
    image: HandsRelay-parser
    container_name: HandsRelay-parser
    restart: unless-stopped
    environment:
      # Inside the compose network the gateway container reaches the
      # parser via the parser container's IP, not its loopback — so the
      # parser must listen on 0.0.0.0 here (127.0.0.1 inside the
      # container would be unreachable from the gateway). That is safe
      # now that /parse and /find require the shared PARSER_SECRET (H2),
      # and the published port stays 127.0.0.1 on the host.
      - PARSER_HOST=0.0.0.0
      - PARSER_SECRET=${PARSER_SECRET:-}
    ports:
      - "127.0.0.1:5011:5011"
    volumes:
      - parser-weights:/models   # OmniParser weights live here once integrated
    # GPU (NVIDIA): uncomment on a host with the NVIDIA Container Toolkit.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  parser-weights:
